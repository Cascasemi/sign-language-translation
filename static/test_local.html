<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Translator with Background Replacement</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #1a73e8;
        }
        .status {
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
        }
        .connected {
            background-color: #d4edda;
            color: #155724;
        }
        .disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        .controls-section {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .controls-section h3 {
            margin-top: 0;
            color: #495057;
        }
        .background-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1a73e8;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .file-upload {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-upload input[type="file"] {
            display: none;
        }
        .file-upload label {
            padding: 8px 16px;
            background-color: #6c757d;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .file-upload label:hover {
            background-color: #5a6268;
        }
        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        #video {
            display: none;
        }
        #processedVideo {
            width: 100%;
            max-width: 640px;
            height: auto;
            border: 3px solid #1a73e8;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            width: 100%;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        #resetButton {
            background-color: #dc3545;
        }
        #speakButton {
            background-color: #1a73e8;
        }
        .confidence-bar {
            width: 100%;
            max-width: 640px;
            height: 20px;
            background-color: #e9ecef;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .confidence-level {
            height: 100%;
            width: 0%;
            background-color: #28a745;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }
        .upload-status {
            margin-left: 10px;
            font-size: 14px;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Language Translator with Background Replacement</h1>

        <div id="status" class="status disconnected">
            Disconnected from server
        </div>

        <div class="controls-section">
            <h3>Background Controls</h3>
            <div class="background-controls">
                <label for="backgroundToggle">Background Replacement:</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="backgroundToggle" checked>
                    <span class="slider"></span>
                </label>

                <div class="file-upload">
                    <label for="backgroundUpload">Upload Background Image</label>
                    <input type="file" id="backgroundUpload" accept="image/*">
                    <span id="uploadStatus" class="upload-status"></span>
                </div>
            </div>
        </div>

        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <img id="processedVideo">
            <div class="confidence-bar">
                <div id="confidenceLevel" class="confidence-level"></div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="translatedText" placeholder="Translated text will appear here" readonly>
            <button id="resetButton">Reset</button>
            <button id="speakButton">Speak</button>
        </div>

        <div class="footer">
            <p>Real-time sign language translation with MediaPipe landmarks and background replacement</p>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const processedVideo = document.getElementById('processedVideo');
        const status = document.getElementById('status');
        const translatedText = document.getElementById('translatedText');
        const resetButton = document.getElementById('resetButton');
        const speakButton = document.getElementById('speakButton');
        const confidenceLevel = document.getElementById('confidenceLevel');
        const backgroundToggle = document.getElementById('backgroundToggle');
        const backgroundUpload = document.getElementById('backgroundUpload');
        const uploadStatus = document.getElementById('uploadStatus');

        // Server connection
        const socketUrl = window.location.hostname === 'localhost'
            ? 'http://localhost:5000'
            : 'https://fit-firstly-tuna.ngrok-free.app';

        const socket = io(socketUrl, {
            withCredentials: true,
            extraHeaders: {
                "ngrok-skip-browser-warning": "true"
            }
        });

        let isConnected = false;
        let stream;
        let captureInterval;
        let backgroundReplacementEnabled = true;

        // Initialize
        async function init() {
            try {
                // Connect to camera
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: "user"
                    }
                });
                video.srcObject = stream;

                // Start capturing frames
                video.onloadedmetadata = () => {
                    startCapturing();
                };

            } catch (error) {
                console.error('Error initializing:', error);
                alert('Error accessing camera. Please make sure you have a camera connected and have granted permission.');
            }
        }

        // Socket.IO event handlers
        socket.on('connect', () => {
            console.log('Connected to server');
            isConnected = true;
            status.textContent = 'Connected to server';
            status.className = 'status connected';
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            isConnected = false;
            status.textContent = 'Disconnected from server';
            status.className = 'status disconnected';
        });

        socket.on('connection_status', (data) => {
            console.log('Connection status:', data);
            if (!data.background_available) {
                uploadStatus.textContent = 'No background image loaded on server';
                uploadStatus.style.color = '#dc3545';
            }
        });

        socket.on('prediction', (data) => {
            console.log('Received prediction:', data);
            translatedText.value = data.text;

            // Update confidence bar
            if (data.confidence) {
                const confidencePercent = data.confidence * 100;
                confidenceLevel.style.width = `${confidencePercent}%`;

                // Change color based on confidence
                if (confidencePercent > 80) {
                    confidenceLevel.style.backgroundColor = '#28a745';
                } else if (confidencePercent > 50) {
                    confidenceLevel.style.backgroundColor = '#ffc107';
                } else {
                    confidenceLevel.style.backgroundColor = '#dc3545';
                }
            }

            // Update processed video frame
            if (data.annotated_frame) {
                processedVideo.src = `data:image/jpeg;base64,${data.annotated_frame}`;
            }
        });

        socket.on('error', (data) => {
            console.error('Error from server:', data.message);
        });

        // Start capturing frames
        function startCapturing() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            captureInterval = setInterval(() => {
                if (isConnected) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/jpeg', 0.7);
                    const base64Data = imageData.split(',')[1];

                    socket.emit('frame', {
                        image: base64Data,
                        background_replacement: backgroundReplacementEnabled
                    });
                }
            }, 200); // 5 FPS
        }

        // Background controls
        backgroundToggle.addEventListener('change', (e) => {
            backgroundReplacementEnabled = e.target.checked;
        });

        backgroundUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('background', file);

            uploadStatus.textContent = 'Uploading...';
            uploadStatus.style.color = '#6c757d';

            try {
                const response = await fetch(`${socketUrl}/upload_background`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    uploadStatus.textContent = 'Background updated successfully!';
                    uploadStatus.style.color = '#28a745';
                } else {
                    uploadStatus.textContent = `Error: ${result.error}`;
                    uploadStatus.style.color = '#dc3545';
                }
            } catch (error) {
                console.error('Upload error:', error);
                uploadStatus.textContent = 'Upload failed';
                uploadStatus.style.color = '#dc3545';
            }

            // Clear the input
            e.target.value = '';
        });

        // Button handlers
        resetButton.addEventListener('click', () => {
            translatedText.value = '';
            confidenceLevel.style.width = '0%';
        });

        speakButton.addEventListener('click', () => {
            if (translatedText.value) {
                const utterance = new SpeechSynthesisUtterance(translatedText.value);
                speechSynthesis.speak(utterance);
            }
        });

        // Clean up
        window.addEventListener('beforeunload', () => {
            if (captureInterval) clearInterval(captureInterval);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            socket.disconnect();
        });

        // Start the app
        init();
    </script>
</body>
</html>
